name: Deploy to EC2

# 테스트가 통과한 뒤에만 배포한다.
#
# 이전에는 test.yml 과 이 파일이 둘 다 `on: push: branches:[main]` 이라 **독립 병렬로**
# 돌았다. 이름은 "배포 앞단 테스트 게이트"였지만 실제로는 아무것도 막지 못했고,
# 같은 커밋(64aa2bf)에서 배포가 테스트보다 2분 16초 먼저 success 로 끝난 기록이
# 남아 있다 — 계약이 깨진 코드가 그대로 심사용 주소로 나갔다는 뜻이다.
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  # 게이트를 우회해야 할 때를 남겨 둔다 — 러너가 느려 응답시간 테스트만 흔들리는데
  # 배포는 급한 상황이 실제로 있다. Actions 탭에서 손으로 돌린다.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch 는 사람이 판단해 돌린 것이므로 그대로 통과시킨다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # set -eu 가 없으면 앞줄이 죽어도 다음 줄이 계속 돈다. 실제로
          # `git pull` 이 실패해도 그 아래 docker compose 가 **옛 소스로** 돌고
          # 잡은 초록불로 끝났다 — 실패가 성공으로 보이는 가장 나쁜 형태다.
          script: |
            set -eu
            cd /home/ubuntu/hw/hwaseong-dashboard-backend

            # pull 대신 fetch + ff-only. 히스토리가 갈리거나 서버 작업트리에
            # 덮어쓸 변경이 있으면 **여기서 크게 실패한다**(조용히 넘어가지 않는다).
            git fetch origin
            git merge --ff-only origin/main
            echo "배포 대상: $(git rev-parse --short HEAD) $(git log -1 --format=%s)"

            docker compose up -d --build

            # `up -d` 는 컨테이너가 **뜨자마자** 돌아온다. 앱은 시뮬 엔진 import 에
            # 15~20초를 더 쓰고, 기준선 assert 에 걸리면 그 뒤에 죽는다.
            # compose 에 이미 healthcheck 가 있으므로 그것이 healthy 가 될 때까지
            # 기다린다 — 기다리지 않으면 아래 외부 확인이 **아직 살아 있는 옛
            # 컨테이너**의 응답을 받고 통과한다(실제로 배포 잡이 16초에 끝나고 있었다).
            cid=$(docker compose ps -q api)
            for i in $(seq 1 36); do
              st=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)
              [ "$st" = "healthy" ] && break
              sleep 5
            done
            if [ "$st" != "healthy" ]; then
              echo "컨테이너가 healthy 가 되지 못했습니다 (마지막 상태: $st)"
              docker compose logs --tail 60 api
              exit 1
            fi
            echo "컨테이너 healthy 확인"

      # 위에서 컨테이너 자체는 확인했다. 여기서는 **Caddy 를 지나는 실제 경로**가
      # 사는지 본다(인증서·프록시 문제는 컨테이너가 멀쩡해도 생긴다).
      - name: 배포 확인 — 공개 주소가 실제로 응답하는가
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null --max-time 10 https://15-165-83-80.sslip.io/api/v1/meta; then
              echo "공개 주소 확인 완료 (${i}회차)"
              exit 0
            fi
            echo "대기 중… (${i}/10)"
            sleep 10
          done
          echo "::error::컨테이너는 healthy 인데 공개 주소가 응답하지 않습니다 — Caddy 를 확인하세요."
          exit 1
