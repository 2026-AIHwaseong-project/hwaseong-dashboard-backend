name: Test

# 배포(deploy.yml)는 이 워크플로가 통과한 뒤에만 돕니다 — workflow_run 으로 연결돼
# 있고, 실패하면 EC2 로 나가지 않습니다. 급할 때는 Actions 탭에서 Deploy 를 손으로
# 돌려 우회할 수 있습니다(workflow_dispatch).
#
# 이 워크플로의 이름("Test")은 deploy.yml 이 문자열로 참조합니다 — 바꾸면 게이트가
# 조용히 풀립니다(트리거가 매칭되지 않아 배포가 아예 안 돌게 됩니다).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ① 파이프라인 단위 + ② API 통합 — 프론트 없이 백엔드만으로 돈다
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: ① 파이프라인 단위 테스트
        run: python -m pytest tests/test_pipeline.py -q -m "not slow"
      - name: ② API 통합 테스트
        run: python -m pytest tests/test_api.py -q -m "not slow"

  # 산출물 재현성 — 커밋된 계약 JSON 이 파이프라인 재실행 결과와 같은지
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install pytest
      - name: 04_model.py 재실행 → 바이트 동일 확인
        run: python -m pytest tests/test_pipeline.py -q -m slow

  # ③ 브라우저 E2E — 프론트 저장소를 형제 폴더로 체크아웃해 /app 서빙
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hwaseong-dashboard-backend
      - uses: actions/checkout@v4
        with:
          repository: 2026-AIHwaseong-project/hwaseong-dashboard
          path: hwaseong-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 의존성 설치
        working-directory: hwaseong-dashboard-backend
        run: |
          pip install -r requirements.txt
          pip install pytest playwright
          playwright install --with-deps chromium
      - name: ③ E2E
        working-directory: hwaseong-dashboard-backend
        run: python -m pytest tests/test_e2e.py -q -m e2e
      - name: 실패 시 스크린샷 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: hwaseong-dashboard-backend/test-results/
          if-no-files-found: ignore
