services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/meta"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s   # Poisson 회귀 로드 대기

