services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # 외부 공개는 caddy 만. 로컬 디버그용으로만 열어둔다.
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # 비어 있으면 server/db.py 가 곧장 계약 JSON 으로 갑니다 — 기본 동작은
      # DB 를 붙이기 전과 완전히 같습니다(경고도 안 찍힙니다).
      - DATABASE_URL=${DATABASE_URL:-}
      # 관리자 콘솔 인증. .env 에 적어도 되고 셸 변수로 덮어써도 된다.
      # 비어 있으면 콘솔이 인증 없이 열린다(내부망 전제) — 공개 서버면 반드시 설정.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # 데이터 파일 업로드. 기본은 꺼짐 — 켜지 않으면 업로드 라우트가 404 라서
      # 주소를 아는 사람이 파일을 올릴 방법 자체가 없다. 시연 직전에만 켠다.
      - HW_UPLOAD_ENABLED=${HW_UPLOAD_ENABLED:-0}
      # 올린 파일을 **라이브에 실제로 반영**하는 것까지 허용할지. 이것도 기본 꺼짐.
      # 꺼져 있으면 검증(예행)까지만 되고 라이브 데이터는 한 바이트도 안 바뀐다.
      - HW_UPLOAD_APPLY=${HW_UPLOAD_APPLY:-0}
    # 업로드가 열리면 큰 본문이 들어올 수 있다. 상한이 없으면 OOM 이 호스트
    # 전체를 흔들어 Caddy 까지 같이 죽는다 — 컨테이너 안에서 끝나게 한다.
    mem_limit: 1500m
    volumes:
      # 관리자 오버라이드·이력·재계산 산출이 여기 쌓인다. 마운트가 없으면
      # 컨테이너 쓰기 레이어에만 남아 다음 deploy(git pull + --build)에서
      # 조용히 소실된다 — 관리자 수정이 배포마다 초기화되는 사고.
      - ./var:/app/var
    restart: unless-stopped
    healthcheck:
      # curl 을 쓰면 안 된다 — 베이스가 python:3.11-slim 이라 curl 이 없어서
      # 헬스체크가 "구조적으로 항상 실패"했다(서비스는 멀쩡한데 컨테이너가
      # 계속 unhealthy 로 찍혀, 진짜 장애를 알아볼 수 없는 상태였다).
      # 이미지에 확실히 있는 파이썬으로 두드린다. 응답 본문은 읽지 않으므로
      # meta 가 127KB 여도 헤더까지만 오간다. 4xx·5xx·연결 실패는 예외로
      # 죽어 종료코드가 1 이 된다.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/meta', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s   # 시뮬 엔진 import(거리행렬·Poisson 회귀) 대기 — 실측 15~20초

  # Caddy — Cloudflare Pages(HTTPS 고정)가 이 API 를 부르려면 API 도 HTTPS 여야 한다.
  #   sslip.io 가 호스트명을 IP 로 풀어주고, Caddy 가 그 이름으로 Let's Encrypt
  #   인증서를 자동 발급·갱신한다. 도메인 구매·수동 인증서 갱신이 필요 없다.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api

  # PostgreSQL + PostGIS — 관리자 수정·실시간용. 기본 기동에는 안 뜹니다.
  #
  #   docker compose up -d                    → api 만. 계약 JSON 으로 동작(종전과 동일)
  #   docker compose --profile db up -d       → db 도 함께
  #
  # profiles 를 쓰는 이유 — README §8 의 반대 근거가 "발표장에서 컨테이너가 하나 더
  # 뜨고 장애 지점이 하나 는다" 였습니다. 기본 경로에서 안 뜨면 그 반대 근거가
  # 그대로 유지되고, 필요한 사람만 플래그 하나로 켭니다.
  db:
    profiles: ["db"]
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: hwaseong
      POSTGRES_USER: hw
      POSTGRES_PASSWORD: hw_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 빈 데이터 디렉터리로 처음 뜰 때만 실행됩니다. 스키마를 고친 뒤에는
      # python analysis/06_load_db.py 가 매번 다시 걸어 주므로(전부 IF NOT EXISTS /
      # OR REPLACE) 볼륨을 지울 필요는 없습니다.
      - ./server/schema_ops.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hw -d hwaseong"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:      # Let's Encrypt 인증서 — 없으면 재기동마다 재발급 시도하다 rate limit 에 걸릴 수 있다
  caddy_config:
  pgdata:
